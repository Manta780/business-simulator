<div class="min-h-screen bg-slate-950 flex items-center justify-center px-6">

  <div class="w-full max-w-md">

    <!-- Logo / título -->
    <div class="text-center mb-8">

      <div class="inline-flex items-center justify-center
                  w-16 h-16 rounded-2xl
                  bg-blue-600 mb-5">

        <span class="text-2xl font-bold text-white">
          BS
        </span>

      </div>

      <h1 class="text-3xl font-bold text-white">
        Business Simulator
      </h1>

      <p class="text-slate-400 mt-2">
        Plataforma de simulación empresarial
      </p>

    </div>


    <!-- Card -->
    <div class="bg-slate-900 border border-slate-800
                rounded-2xl p-8 shadow-2xl">

      <h2 class="text-xl font-semibold text-white mb-6">
        Iniciar sesión
      </h2>


      <!-- Email -->
      <div class="mb-5">

        <label class="block text-sm font-medium text-slate-300 mb-2">
          Correo electrónico
        </label>

        <input
          type="email"
          placeholder="correo@universidad.edu.co"
          class="w-full px-4 py-3 rounded-xl
                 bg-slate-800 border border-slate-700
                 text-white placeholder-slate-500
                 focus:outline-none focus:ring-2
                 focus:ring-blue-500"
        />

      </div>


      <!-- Password -->
      <div class="mb-6">

        <label class="block text-sm font-medium text-slate-300 mb-2">
          Contraseña
        </label>

        <input
          type="password"
          placeholder="••••••••"
          class="w-full px-4 py-3 rounded-xl
                 bg-slate-800 border border-slate-700
                 text-white placeholder-slate-500
                 focus:outline-none focus:ring-2
                 focus:ring-blue-500"
        />

      </div>


      <!-- Button -->
      <button
        type="button"
        class="w-full py-3 rounded-xl
               bg-blue-600 hover:bg-blue-500
               text-white font-semibold
               transition-colors">

        Iniciar sesión

      </button>

    </div>


    <p class="text-center text-xs text-slate-600 mt-6">
      Business Simulator · Prototipo académico
    </p>

  </div>

</div>
